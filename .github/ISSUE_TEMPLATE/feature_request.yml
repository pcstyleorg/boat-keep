name: Feature request
description: Something boat-keep should keep, or a way it should work.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and where boat-keep gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: The behaviour or command you have in mind. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now
      description: Workarounds or other tools you've tried.
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this.
